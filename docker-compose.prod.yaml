services:
  metabase-db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${MB_DB_USER:-metabase}"
      POSTGRES_PASSWORD: "${MB_DB_PASS:-metabase}"
      POSTGRES_DB: "${MB_DB_DBNAME:-metabase}"
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_DB_USER:-metabase} -d ${MB_DB_DBNAME:-metabase}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  metabase:
    image: "${METABASE_IMAGE:-metabase/metabase:latest}"
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: "${MB_DB_TYPE:-postgres}"
      MB_DB_DBNAME: "${MB_DB_DBNAME:-metabase}"
      MB_DB_PORT: "${MB_DB_PORT:-5432}"
      MB_DB_USER: "${MB_DB_USER:-metabase}"
      MB_DB_PASS: "${MB_DB_PASS:-metabase}"
      MB_DB_HOST: "${MB_DB_HOST:-metabase-db}"
    depends_on:
      metabase-db:
        condition: service_healthy
    restart: always

volumes:
  metabase-db-data:
